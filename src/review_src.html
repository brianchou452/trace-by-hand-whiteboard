<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>題目複習</title>
<style>
/*PALETTE*/
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--marker)}
button,.button,input,select,textarea{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:.5rem .75rem}
button,.button{cursor:pointer;text-decoration:none;color:var(--ink)}
button:hover,.button:hover{border-color:var(--marker)}
button:disabled{cursor:default;opacity:.55}
:focus-visible{outline:2px solid var(--marker);outline-offset:2px}
.primary{background:var(--marker-bg);border-color:var(--marker);color:var(--marker);font-weight:700}
header{background:var(--surface);border-bottom:1px solid var(--line)}
header .shell{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;padding-block:1rem}
.shell{max-width:1040px;margin:auto;padding-inline:1.25rem}
header h1{margin:0 auto 0 0;font-size:1.35rem}
nav{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.5rem 0}
nav button[aria-current="page"]{background:var(--marker-bg);border-color:var(--marker);color:var(--marker)}
section,details.panel{margin-block:1rem;padding:1rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
h2,h3,p{margin:0 0 .65rem}
h2{font-size:1.2rem}
h3{font-size:1rem}
small,.muted{color:var(--ink-2)}
.actions,.filters,.tags,.row-meta{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem}
.row{display:flex;align-items:center;gap:.75rem;padding:.7rem 0;border-top:1px solid var(--line)}
.row-main{min-width:0;flex:1;overflow-wrap:anywhere}
.row-meta{font-size:.85rem;margin-top:.2rem}
.tag{background:var(--surface-2);padding:.05rem .45rem;border-radius:6px}
.overdue,.error{color:var(--red)}
.error:empty,#notice:empty{display:none}
#notice{margin-block:1rem}
dialog{width:min(640px,calc(100% - 1.5rem));max-height:90dvh;padding:1.25rem;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:#0008}
.dialog-header{display:flex;justify-content:space-between;gap:.5rem;align-items:start}
form{display:grid;gap:.75rem}
label.field{display:grid;gap:.25rem;min-width:0}
.filters input[type="search"]{flex:1;min-width:min(15rem,100%)}
textarea{resize:vertical;min-height:5rem;width:100%}
input,select{max-width:100%}
input[type="checkbox"]{width:1.1rem;height:1.1rem;accent-color:var(--marker)}
input[type="file"]{width:100%}
.filters,.actions,.history{margin-block:.6rem}
.history article{padding:.6rem 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.history p{white-space:pre-wrap;margin-bottom:0}
summary{cursor:pointer;font-weight:700}
footer{padding-block:1rem;color:var(--ink-2);overflow-wrap:anywhere}
@media(max-width:570px){
  .shell{padding-inline:.75rem}
  .row{flex-wrap:wrap;align-items:start}
  .row-main{flex-basis:80%}
  .row > .actions{margin:0}
  header h1{order:-1;flex-basis:100%}
}
</style>
</head>
<body>
<header><div class="shell" id="header"></div></header>
<main class="shell">
  <nav id="tabs"></nav>
  <p id="notice" role="status"></p>
  <div id="view"></div>
  <footer id="sources"></footer>
</main>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog>

</body>
</html>
